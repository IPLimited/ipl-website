# Ежедневное обновление котировок для строки в шапке сайта.
# Запускает update-rates.mjs и коммитит свежий data/rates.js —
# GitHub Pages после коммита автоматически перепубликует сайт.
#
# Время выбрано так, чтобы все три источника уже опубликовали данные за день:
# LBMA Gold PM выходит после 15:00 UTC, Westmetall (медь LME) — во второй
# половине дня по Европе, курс Нацбанка РК известен с утра.
# Запустить вручную: вкладка Actions → Update rates → Run workflow.

name: Update rates

on:
  schedule:
    - cron: "0 17 * * *"   # каждый день в 17:00 UTC (23:00 Алматы)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch rates
        run: node update-rates.mjs

      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "actions@github.com"
          git add data/rates.js data/rates.json
          if git diff --cached --quiet; then
            echo "Котировки не изменились — коммит не нужен."
          else
            git commit -m "Обновление котировок $(date -u +%Y-%m-%d)"
            git push
          fi
